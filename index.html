<style>
#reyes-love-letter { --paper:light-dark(#fffaf0,#302820); --ink:light-dark(#634535,#ffead4); --rose:light-dark(#b95766,#f2a5b1); --env:light-dark(#ebc2b2,#705145); --env-front:light-dark(#f4d6c5,#886353); --env-flap:light-dark(#f9e2d3,#987263); --shade:light-dark(#80554125,#00000045); color:var(--ink); font-family:Georgia,serif; }
#reyes-love-letter * { box-sizing:border-box; }
#reyes-love-letter .letter-stage { padding:24px 12px 28px; text-align:center; overflow:hidden; }
#reyes-love-letter .little-heading { letter-spacing:.15em; margin-bottom:22px; }
#reyes-love-letter .envelope-wrap { width:min(100%,390px); height:280px; position:relative; margin:0 auto 22px; perspective:1000px; transition:height .7s ease; }
#reyes-love-letter .envelope-back { position:absolute; bottom:0; height:230px; width:100%; background:var(--env); border-radius:8px; box-shadow:0 16px 30px var(--shade); }
#reyes-love-letter .love-note { position:absolute; width:90%; left:5%; bottom:12px; padding:18px 12px 12px; min-height:390px; background:var(--paper); color:var(--ink); border-radius:5px; box-shadow:0 2px 15px var(--shade); opacity:0; transform:translateY(120px) scale(.93); transition:transform .85s ease,opacity .45s ease; z-index:2; }
#reyes-love-letter .love-note img { width:154px; height:auto; margin:0 auto 10px; display:block; border-radius:50%; }
#reyes-love-letter h2,#reyes-love-letter h3 { font-family:Georgia,serif; color:var(--ink); font-weight:500; margin:10px 0; }
#reyes-love-letter p { margin:16px 0; }
#reyes-love-letter .tiny-heart { color:var(--rose); display:block; margin-top:12px; }
#reyes-love-letter .envelope-front { position:absolute; bottom:0; width:100%; height:230px; background:var(--env-front); clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%); border-radius:0 0 8px 8px; z-index:3; }
#reyes-love-letter .envelope-flap { position:absolute; bottom:100px; width:100%; height:130px; background:var(--env-flap); clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:top; transition:transform .65s ease; z-index:4; backface-visibility:hidden; }
#reyes-love-letter .seal { position:absolute; bottom:90px; left:calc(50% - 23px); width:46px; height:46px; border-radius:50%; background:var(--rose); color:var(--paper); display:grid; place-items:center; z-index:5; transition:opacity .2s ease; }
#reyes-love-letter .envelope-name { position:absolute; bottom:30px; width:100%; z-index:5; font-style:italic; }
#reyes-love-letter .open-letter { appearance:none; background:var(--ink); color:var(--paper); border:0; border-radius:30px; padding:14px 26px; font:inherit; min-height:46px; }
#reyes-love-letter .open-letter:focus-visible { outline:3px solid var(--rose); outline-offset:4px; }
#reyes-love-letter.open .envelope-wrap { height:650px; }
#reyes-love-letter.open .envelope-flap { transform:rotateX(180deg); }
#reyes-love-letter.open .seal { opacity:0; }
#reyes-love-letter.open .love-note { opacity:1; transform:translateY(-235px) scale(1); transition-delay:.3s; }
#reyes-love-letter .screen-reader { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
@media(prefers-reduced-motion:reduce) { #reyes-love-letter * { transition:none!important; } }
</style>
<script>
(() => {
  const root = document.getElementById('reyes-love-letter');
  const button = root.querySelector('.open-letter');
  const note = root.querySelector('.love-note');
  const announcement = root.querySelector('.screen-reader');
  button.addEventListener('click', () => {
    const opened = root.classList.toggle('open');
    button.setAttribute('aria-expanded', String(opened));
    note.setAttribute('aria-hidden', String(!opened));
    note.inert = !opened;
    button.textContent = opened ? 'Guardar mi carta ♥' : 'Abrir mi carta ♥';
    announcement.textContent = opened ? 'Somos los pollitos. Solo confía y baja la guardia, soy tu lugar seguro. Te amo, Reyes.' : 'Carta cerrada.';
  });
})();
</script>

</body></html>
